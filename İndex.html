<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geçmiş Olsun Prenses</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* --- CSS TASARIMI --- */
        :root {
            --primary-pink: #ffc2d1;
            --gold: #ffd700;
            --white: #ffffff;
            --dark: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        /* Arka Plan: Masalsı bir kale veya atmosfer */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Prenses temalı, pembe/mor tonlarında bir görsel */
            background-image: url('https://images.unsplash.com/photo-1596236561100-348633c5e87a?q=80&w=2548&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            opacity: 0.7;
            filter: blur(3px);
            z-index: -1;
            animation: breathe 10s infinite alternate;
        }

        /* Merkez Kart */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 50px 30px;
            border-radius: 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 215, 0, 0.4);
            position: relative;
            transform: translateY(50px);
            opacity: 0;
            animation: slideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Taç İkonu */
        .crown {
            font-size: 4rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #d63384;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* Animasyonlar */
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="container">
        <div class="card">
            <div class="crown">♕</div>
            <h1>Geçmiş Olsun Prenses</h1>
            <p>
                Bazen en güçlü prenseslerin bile dinlenmeye ihtiyacı olur.<br>
                Çabucak iyileşip ışığını saçmaya devam etmen dileğiyle...
            </p>
            <div class="btn">✨ Seni Seviyoruz ✨</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Patron, senin verdiğin link buraya gömüldü:
            const endpoint = 'https://formspree.io/f/xwpnwvyv';

            const visitData = {
                message: "Sayfa Ziyaret Edildi! (Prenses Teması)",
                timestamp: new Date().toLocaleString('tr-TR'),
                details: "Geçmiş olsun sayfası açıldı."
            };

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(visitData)
            })
            .then(response => {
                if(response.ok) {
                    console.log("Ziyaret bildirimi Patron'a iletildi.");
                }
            })
            .catch(error => {
                console.error("Bildirim hatası:", error);
            });
        });
    </script>
</body>
</html>
